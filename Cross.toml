[build.env]
passthrough = ["RUST_BACKTRACE", "CROSS_CONTAINER_ENGINE_NO_BUILDKIT"]

# For aarch64 target - native on arm64 Mac
[target.aarch64-unknown-linux-musl]
image = "ghcr.io/cross-rs/aarch64-unknown-linux-musl:main"

# For x86_64 target - force QEMU emulation via linux/amd64 platform
[target.x86_64-unknown-linux-musl]
image = "ghcr.io/cross-rs/x86_64-unknown-linux-musl:main"
# Force the container to run as linux/amd64 with QEMU, not Rosetta
env.DOCKER_DEFAULT_PLATFORM = "linux/amd64"
